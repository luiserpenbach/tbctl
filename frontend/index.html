<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230b0e13'/%3E%3Cpath d='M2 11 L6 11 L8 4 L10 12 L12 8 L14 8' stroke='%234cc9f0' stroke-width='1.6' fill='none'/%3E%3C/svg%3E"
    />
    <title>tbctl</title>
    <script>
      // theme before first paint (mirrors src/theme-pref.ts), so no flash
      try {
        var pref = localStorage.getItem("tbctl.theme") || "system";
        var light = pref === "light" || (pref === "system" && matchMedia("(prefers-color-scheme: light)").matches);
        document.documentElement.dataset.theme = light ? "light" : "dark";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
