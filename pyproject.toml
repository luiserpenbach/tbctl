[project]
name = "tbctl"
version = "0.1.0"
description = "Testbench control software: DAQ + valve control + deterministic sequencing for GH2/GOX thruster testing"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "h5py>=3.11",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "websockets>=12.0",
    "msgpack>=1.0",
]

[project.optional-dependencies]
# The LJM python wrapper needs the LJM shared library installed on the host.
# Only required for real-hardware operation; the simulator has no hardware deps.
hw = ["labjack-ljm>=1.23"]

[project.scripts]
tbctl = "tbctl.cli:main"
tbctl-node = "tbctl.node:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tbctl"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "shared"]
extend-exclude = ["src/tbctl/hw/registers_gen.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
