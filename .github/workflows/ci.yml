name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - uses: astral-sh/setup-uv@v5
      - name: Sync deps (no hardware extra — simulator only)
        # --locked fails CI on a stale lockfile instead of silently re-resolving
        run: uv venv --python 3.12 && uv sync --locked
      - name: Ruff lint + format
        # include tools/ so the whole tree is linted, not just src/shared/tests
        run: |
          uv run ruff check src shared tests tools
          uv run ruff format --check src shared tests tools
      - name: Generated register constants in sync (D10)
        run: uv run tbctl codegen --check
      - name: Example configs validate
        run: uv run tbctl validate --config-dir configs
      - name: Pytest (unit + simulator integration)
        run: uv run pytest -q
      - name: Lua CRC golden vectors (D8)
        run: lua5.4 tests/lua/run_crc_tests.lua
      - name: Real sequencer.lua state machine (§10.1)
        run: lua5.4 tests/lua/run_sequencer_tests.lua
        # NOTE: the DEPLOYED (minified) artifact is run through the same harness
        # by tests/test_lua_sequencer.py::test_minified_sequencer_state_machine
        # in the Pytest step above, so a minifier regression cannot ship green.

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type-check + build
        run: npm run build
      - name: Upload built SPA (docs/deployment.md consumes this)
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
