# EXAMPLE pre-fire procedural checklist (roadmap phase 15). Checking items
# logs events; completion is shown next to ARM but never blocks anything.
# Replace with the Hopper / Aldenhoven test procedure (TODO.md).
name: pre_fire
items:
  - Test area clear, access closed, warning light on
  - Cameras + DAQ recording armed
  - H2 gas detection active, no alarms
  - N2 purge bottle open, regulator at 10 bar
  - Oxidizer and fuel tank pressures nominal
  - Vent valves confirmed OPEN (fail-safe state)
  - Igniter continuity checked
  - Sequence loaded and compile report reviewed
  - Redlines reviewed for this test
  - Abort button within reach
