# Default dashboard (spec §4.3 example).
name: main
grid: {cols: 12, row_height_px: 40}
panels:
  - {id: p1, type: timeseries, x: 0, y: 0, w: 8, h: 8,
     channels: [pressure.chamber, pressure.ox_manifold, pressure.fuel_manifold],
     y_axis: {mode: auto}}
  - {id: p2, type: value_table, x: 8, y: 0, w: 4, h: 4, channels: ["pressure.*", "temp.*"]}
  - {id: p3, type: valve_panel, x: 8, y: 4, w: 4, h: 4}
  - {id: p4, type: sequence_panel, x: 0, y: 8, w: 6, h: 4}
  - {id: p5, type: recorder_panel, x: 6, y: 8, w: 6, h: 4}
