# EXAMPLE 5 s hot fire, N2 pre/post purge (spec §4.2). Timings are
# placeholders until the Hopper engine sequence is defined (TODO.md).
name: hotfire_v1
description: 5 s hot fire, N2 pre/post purge
test_type: engine               # hopper-test-lab test type of runs that fire this
max_duration_s: 15.0
preconditions:
  - {tag: pressure.n2_purge, min: 8.0}
redlines:                        # host-side auto-abort while armed/running
  - {tag: pressure.chamber, max: 22.0, persist_ms: 60}
  - {tag: temp.chamber_wall, max: 450.0, persist_ms: 100}
steps:
  - {t: 0.000, set: {valve.purge: open}}
  - {t: 2.000, set: {valve.purge: close}}
  - {t: 2.500, set: {igniter.main: on}}
  - {t: 2.550, set: {valve.ox_main: open}}
  - {t: 2.600, set: {valve.fuel_main: open}}
  - {t: 2.800, set: {igniter.main: off}}
  - {t: 7.600, set: {valve.fuel_main: close}}
  - {t: 7.650, set: {valve.ox_main: close}}
  - {t: 7.900, set: {valve.purge: open}}
  - {t: 10.900, set: {valve.purge: close}}
abort:
  - {t: 0.000, set: {valve.fuel_main: close, valve.ox_main: close, igniter.main: off}}
  - {t: 0.100, set: {valve.purge: open}}
  - {t: 5.100, set: {valve.purge: close}}
